[project]
name = "gender-representation-networks"
version = "0.1.0"
description = "Complex networks of Transformer token representations: from the lexical to the contextual network."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "accelerate>=1.0",
    "matplotlib>=3.8",
    "networkx>=3.2",
    "pyyaml>=6.0",
    "safetensors>=0.4",
    "torch>=2.2",
    "transformers>=4.51",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.9",
]

[project.scripts]
gender-networks-network-pilot = "gender_networks.network_pilot:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gender_networks"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
per-file-ignores = { "src/gender_networks/network_pilot.py" = ["E501"] }
