model:
  name_or_path: Qwen/Qwen3-4B-Base
  # Commit fixado do repositório no Hugging Face (reprodutibilidade).
  revision: 906bfd4b4dc7f14ee4320094d8b41684abff8539
  trust_remote_code: false
  torch_dtype: bfloat16
  device_map: auto
  # Os pesos (~7,5 GiB) não cabem inteiros nos 8 GiB da RTX 4070; o resto vai para a CPU.
  max_memory:
    0: 6GiB
    cpu: 10GiB

tokenization:
  add_special_tokens: false
  truncation: false
  max_length: null

extraction:
  # Índices na tupla outputs.hidden_states: 0 = embeddings, -1 = último bloco (pós-RMSNorm).
  hidden_state_indices: [0, -1]
